services:
  teknika:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:4310:4310"
    environment:
      DEMO_MODE: "0"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
      APP_URL: "${APP_URL:-${PUBLIC_ORIGIN:-http://localhost:4310}}"
      SETUP_TOKEN: "${SETUP_TOKEN:?Définissez SETUP_TOKEN dans .env avant le lancement}"
    volumes:
      - teknika-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    tmpfs:
      - /tmp
volumes:
  teknika-data:
