# Installed as compose.override.yaml by scripts/deploy-postgres.sh.
# Always load both .env and .env.postgres; missing secrets fail closed.
services:
  teknika:
    image: "${TEKNIKA_APP_IMAGE:?Charger .env.postgres avec --env-file}"
    environment:
      DATABASE_URL: "${DATABASE_URL:?Charger .env.postgres avec --env-file}"
      DEMO_MODE: "0"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Charger .env.postgres avec --env-file}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Charger .env.postgres avec --env-file}"
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - teknika-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  teknika-postgres:
    name: teknika-postgres
