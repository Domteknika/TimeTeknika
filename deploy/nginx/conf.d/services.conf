# All traffic enters through cloudflared installed on the Ubuntu host.
# Unknown hostnames must never fall through to TimeTeknika.
server {
    listen 127.0.0.1:8080 default_server;
    server_name _;
    return 404;
}

server {
    listen 127.0.0.1:8080;
    server_name timeteknika.domteknika.ch;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";

        # SSE updates must be delivered immediately and remain connected.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
